name: Verify Vision Studio application
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Automated tests
        run: npm test
      - name: Source verification
        run: |
          npm run check:source
          npm run check:typescript-source
          npm run check:module-graph
          npm run check:cloud-declarations
      - name: Next.js build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee vision-build.log
      - name: Upload application build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-build-log
          path: vision-build.log
          if-no-files-found: ignore
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test offline preview
        run: python browser-tests/test_preview.py
      - name: Upload preview browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-browser-log
          path: |
            browser-test-artifacts/
            preview-server.log
          if-no-files-found: ignore
  next-dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      VISION_NEXT_TEST_URL: 'http://127.0.0.1:4190'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and browser
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Start Next.js and test dashboard
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 4190 > vision-next-server.log 2>&1 &
          SERVER_PID=$!
          ready=0
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' --fail --silent --show-error --max-time 3 "$VISION_NEXT_TEST_URL" -o /dev/null 2>> vision-next-readiness.log; then
              echo "Next.js HTTP ready after ${attempt} attempt(s)" | tee -a vision-next-readiness.log
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Next.js starter process exited early" | tee -a vision-next-readiness.log
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Next.js did not respond to HTTP readiness checks"
            echo "--- server output ---"
            cat vision-next-server.log
            echo "--- HTTP checks ---"
            tail -30 vision-next-readiness.log
            exit 1
          fi
          python browser-tests/test_next_dashboard.py
      - name: Upload dashboard browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-next-browser-diagnostics
          path: |
            vision-next-server.log
            vision-next-readiness.log
            browser-test-artifacts/
          if-no-files-found: ignore
