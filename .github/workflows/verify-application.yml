name: Verify Vision Studio application
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Automated tests
        run: npm test
      - name: Source verification
        run: |
          npm run check:source
          npm run check:typescript-source
          npm run check:module-graph
          npm run check:cloud-declarations
      - name: Next.js build
        run: npm run build
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test offline preview
        run: python browser-tests/test_preview.py
  next-dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Start Next.js and test dashboard
        run: |
          npm run dev > vision-next-server.log 2>&1 &
          node scripts/wait-for-next.mjs
          python browser-tests/test_next_dashboard.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-dashboard-diagnostics
          path: |
            vision-next-server.log
            browser-test-artifacts/
          if-no-files-found: ignore
